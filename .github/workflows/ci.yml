name: Build Galastri Disable DocBlocks Highlights

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Focused smoke checks
        run: npm test
      - name: Package VSIX
        run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: galastri-disable-docblocks-highlights-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 30
